<svg xmlns="http://www.w3.org/2000/svg" width="310" height="40" viewBox="0 0 310 40" role="img" aria-label="Made in Europe · for everyone">
  <defs>
    <linearGradient id="eu-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b7f"/>
      <stop offset="100%" stop-color="#001a4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container badge with EU blue border and rich flag background -->
